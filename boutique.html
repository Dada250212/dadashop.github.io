<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boutique - Dada Shop</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f8f5f0;
color: #1f1f1f;
}

header {
background: #ffffff;
padding: 25px 20px;
text-align: center;
border-bottom: 1px solid #e3dbd2;
}

header h1 {
margin: 0;
font-size: 38px;
letter-spacing: 2px;
}

nav {
margin-top: 18px;
}

nav a {
margin: 0 12px;
text-decoration: none;
color: #1f1f1f;
font-weight: bold;
}

.titre {
text-align: center;
padding: 60px 20px 30px;
}

.titre h2 {
font-size: 38px;
margin-bottom: 10px;
}

.titre p {
color: #6b625c;
font-size: 17px;
}

.produits {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
gap: 25px;
max-width: 1100px;
margin: 30px auto 80px;
padding: 0 25px;
}

.produit {
background: #ffffff;
border-radius: 15px;
padding: 20px;
text-align: center;
box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.photo {
height: 260px;
background: #e9dfd6;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
color: #756960;
margin-bottom: 18px;
}
  
.photo img {
width: 100%;
height: 100%;
object-fit: contain;
border-radius: 12px;
}

.produit h3 {
margin: 10px 0;
font-size: 20px;
}

.prix {
font-weight: bold;
font-size: 18px;
margin: 12px 0;
}

.bouton {
display: inline-block;
padding: 11px 22px;
background: #1f1f1f;
color: white;
text-decoration: none;
border-radius: 25px;
}

footer {
text-align: center;
padding: 25px;
background: #ffffff;
color: #555;
}
</style>
</head>

<body>

<header>
<h1>Dada Shop</h1>

<nav>
<a href="index.html">Accueil</a>
<a href="boutique.html">Boutique</a>
<a href="#">À propos</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="titre">
<h2>Notre boutique</h2>
<p>Découvrez nos produits et nos créations.</p>
</section>

<section class="produits">

<div class="produit">
<div class="photo">
<img src="Sac_franges.jpg" alt="Sac à franges">
</div>

<h3>Sac à franges</h3>

<p class="prix">20 €</p>

<a class="bouton" href="#">Découvrir</a>
</div>

<div class="produit">
<div class="photo">
Photo du produit
</div>

<h3>Produit 2</h3>

<p class="prix">Prix à venir</p>

<a class="bouton" href="#">Découvrir</a>
</div>

<div class="produit">
<div class="photo">
Photo du produit
</div>

<h3>Produit 3</h3>

<p class="prix">Prix à venir</p>

<a class="bouton" href="#">Découvrir</a>
</div>

</section>

<footer>
© 2026 Dada Shop
</footer>

</body>
</html>
