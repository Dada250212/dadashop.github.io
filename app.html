<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dada Shop</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#EAF7FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
--clair:#EAF7FF;
--pale:#D8F0FF;
--bleu:#8CCFF2;
--moyen:#55B5E8;
--fonce:#247FAF;
--texte:#18394D;
--gris:#78909C;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:white;
color:var(--texte);
padding-bottom:85px;
}

/* EN-TÊTE */

header{
position:sticky;
top:0;
z-index:5;
background:white;
padding:0;
}

.zone-logo{
background:#EAF7FF;
padding:13px 15px 10px;
}

.logo{
font-family:"Brush Script MT","Segoe Script","URW Chancery L",cursive;
font-size:43px;
font-weight:600;
letter-spacing:0;
color:#173E70;
margin:0;
line-height:1.15;
}

.logo-trait{
width:75%;
max-width:250px;
height:2px;
margin:9px auto 0;
background:linear-gradient(
90deg,
transparent,
#8CCFF2,
#55B5E8,
#8CCFF2,
transparent
);
border-radius:50%;
box-shadow:0 2px 8px rgba(85,181,232,.22);
}

.zone-outils{
background:#F7FCFF;
padding:12px 15px 0;
}

.recherche-ligne{
display:flex;
align-items:center;
gap:9px;
}

.loupe{
width:21px;
height:21px;
flex-shrink:0;
stroke:var(--fonce);
fill:none;
stroke-width:2;
}

.recherche{
flex:1;
min-width:0;
padding:13px 16px;
border:1px solid #D8F0FF;
border-radius:25px;
background:#FFFFFF;
font-size:15px;
outline:none;
color:var(--texte);
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding:13px 0;
scrollbar-width:none;
background:#F7FCFF;
}

.categories::-webkit-scrollbar{display:none}

.categorie{
border:0;
border-radius:22px;
padding:10px 15px;
white-space:nowrap;
background:#EAF7FF;
color:var(--texte);
font-size:13px;
}

.categorie.active{
background:var(--fonce);
color:white;
}

/* PAGES ET ANIMATIONS */

main{
position:relative;
overflow:hidden;
}

.page{
display:none;
width:100%;
}

.page.active{
display:block;
}

.page.entre-droite{
display:block;
position:relative;
z-index:2;
animation:entreDroite 320ms cubic-bezier(.22,.75,.25,1) both;
}

.page.entre-gauche{
display:block;
position:relative;
z-index:2;
animation:entreGauche 320ms cubic-bezier(.22,.75,.25,1) both;
}

.page.sort-gauche{
display:block;
position:absolute;
top:0;
left:0;
width:100%;
z-index:1;
animation:sortGauche 320ms cubic-bezier(.22,.75,.25,1) both;
}

.page.sort-droite{
display:block;
position:absolute;
top:0;
left:0;
width:100%;
z-index:1;
animation:sortDroite 320ms cubic-bezier(.22,.75,.25,1) both;
}

@keyframes entreDroite{
from{transform:translateX(100%)}
to{transform:translateX(0)}
}

@keyframes entreGauche{
from{transform:translateX(-100%)}
to{transform:translateX(0)}
}

@keyframes sortGauche{
from{transform:translateX(0)}
to{transform:translateX(-100%)}
}

@keyframes sortDroite{
from{transform:translateX(0)}
to{transform:translateX(100%)}
}

/* ACCUEIL ET ARTICLES */

.titre{
font-size:21px;
font-weight:bold;
padding:15px 15px 14px;
}

.grille{
display:grid;
grid-template-columns:1fr 1fr;
align-items:start;
gap:8px;
padding:0 10px;
background:white;
}

.produit{
min-width:0;
cursor:pointer;
background:white;
}

.image-produit{
width:100%;
height:auto;
display:block;
object-fit:contain;
border:1px solid #E7F3FA;
border-radius:7px;
background:white;
}

.nom{
font-size:14px;
margin:8px 3px 12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* FICHE PRODUIT */

.retour{
border:0;
background:var(--clair);
color:var(--fonce);
border-radius:22px;
padding:11px 17px;
margin:12px 15px;
}

.detail-image{
width:100%;
height:auto;
max-height:440px;
object-fit:contain;
display:block;
background:white;
}

.detail-contenu{
padding:15px;
}

.detail-prix{
font-size:24px;
font-weight:bold;
color:var(--fonce);
margin:0 0 10px;
}

.detail-nom{
font-size:25px;
font-weight:bold;
margin:0 0 12px;
}

.description{
font-size:15px;
line-height:1.5;
color:var(--gris);
margin:0;
}

.principal{
width:100%;
padding:15px;
border:0;
border-radius:25px;
background:var(--fonce);
color:white;
font-size:16px;
font-weight:bold;
margin-top:20px;
}

.principal:disabled{
background:#AABCC6;
}

/* PANIER */

.bloc{
margin:12px 15px;
padding:17px;
border-radius:14px;
background:var(--clair);
}

.ligne{
display:flex;
align-items:center;
gap:13px;
}

.image-panier{
width:95px;
height:auto;
max-height:110px;
object-fit:contain;
border-radius:9px;
background:white;
}

.info{flex:1}
.info p{margin:7px 0}

.supprimer{
border:0;
background:var(--pale);
color:var(--fonce);
border-radius:18px;
padding:9px 13px;
}

.vide{
text-align:center;
padding:55px 20px;
color:var(--gris);
}

/* PROFIL */

.profil-bloc{
margin:12px 15px;
padding:18px;
border-radius:14px;
background:var(--clair);
}

/* NAVIGATION DU BAS */

nav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:10;
display:flex;
justify-content:space-around;
background:white;
border-top:1px solid var(--pale);
padding:9px 5px calc(9px + env(safe-area-inset-bottom));
}

.nav{
border:0;
background:transparent;
color:var(--gris);
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
font-size:12px;
padding:5px 20px;
}

.nav svg{
width:23px;
height:23px;
stroke:currentColor;
fill:none;
stroke-width:1.8;
}

.nav.active{
color:var(--fonce);
}

button{cursor:pointer}
button:active{transform:scale(.98)}

@media(max-width:380px){
.logo{font-size:38px}
}

@media(prefers-reduced-motion:reduce){
.page.entre-droite,
.page.entre-gauche,
.page.sort-gauche,
.page.sort-droite{
animation:none;
}
}
</style>
</head>

<body>

<header id="entete">

<div class="zone-logo">
<div class="logo">𝒟𝒶𝒹𝒶 𝒮𝒽𝑜𝓅</div>
<div class="logo-trait"></div>
</div>

<div class="zone-outils">

<div class="recherche-ligne">

<svg class="loupe" viewBox="0 0 24 24">
<circle cx="10.8" cy="10.8" r="7.3"></circle>
<path d="m16.2 16.2 5 5"></path>
</svg>

<input class="recherche"
id="recherche"
type="search"
placeholder="Rechercher un article..."
oninput="rechercher()">

</div>

<div class="categories" id="categories">

<button class="categorie active"
onclick="filtrer('Tout',this)">Tout</button>

<button class="categorie"
onclick="filtrer('Sacs',this)">Sacs</button>

<button class="categorie"
onclick="filtrer('Accessoires',this)">Accessoires</button>

<button class="categorie"
onclick="filtrer('Vêtements',this)">Vêtements</button>

<button class="categorie"
onclick="filtrer('Accessoires pour cheveux',this)">
Accessoires pour cheveux
</button>

</div>
</div>
</header>

<main>

<section class="page active" id="accueil">

<div class="titre">Pour vous</div>

<div class="grille">

<article class="produit"
data-category="Sacs"
data-name="Sac à franges"
onclick="ouvrirProduit()">

<img class="image-produit"
src="sac_franges.jpg"
alt="Sac à franges">

<p class="nom">Sac à franges</p>

</article>

</div>

<p class="vide" id="aucun" style="display:none">
Aucun article trouvé.
</p>

</section>

<section class="page" id="detail">

<button class="retour"
onclick="afficherPage('accueil')">
← Retour
</button>

<img class="detail-image"
src="sac_franges.jpg"
alt="Sac à franges">

<div class="detail-contenu">

<p class="detail-prix">20 €</p>

<h2 class="detail-nom">Sac à franges</h2>

<p class="description"></p>

<button class="principal"
id="ajout"
onclick="ajouter()">
Ajouter au panier
</button>

</div>
</section>

<section class="page" id="panier">

<div class="titre">Mon panier</div>

<div id="contenu-panier">
<p class="vide">Ton panier est vide pour le moment.</p>
</div>

</section>

<section class="page" id="profil">

<div class="titre">Mon profil</div>

<div class="profil-bloc">
<strong>Informations personnelles</strong>
<p>Retrouve ici les informations de ton compte.</p>
</div>

</section>

</main>

<nav>

<button class="nav active"
id="nav-accueil"
onclick="afficherPage('accueil')">

<svg viewBox="0 0 24 24">
<path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5"/>
</svg>

Accueil
</button>

<button class="nav"
id="nav-panier"
onclick="afficherPage('panier')">

<svg viewBox="0 0 24 24">
<path d="M3 4h2l2.2 12.5h11.5L21 8H6"/>
<circle cx="9" cy="20" r="1"/>
<circle cx="18" cy="20" r="1"/>
</svg>

Panier
</button>

<button class="nav"
id="nav-profil"
onclick="afficherPage('profil')">

<svg viewBox="0 0 24 24">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21c.5-4.5 3.5-7 8-7s7.5 2.5 8 7"/>
</svg>

Profil
</button>

</nav>

<script>

let panier=[];
let pageActuelle='accueil';
let transitionEnCours=false;

const ordrePages={
accueil:0,
detail:1,
panier:2,
profil:3
};

function afficherPage(nom){

if(nom===pageActuelle || transitionEnCours)return;

let anciennePage=document.getElementById(pageActuelle);
let nouvellePage=document.getElementById(nom);

let retour=ordrePages[nom]<ordrePages[pageActuelle];

anciennePage.classList.remove('active');
nouvellePage.classList.add('active');

anciennePage.classList.add(
retour?'sort-droite':'sort-gauche'
);

nouvellePage.classList.add(
retour?'entre-gauche':'entre-droite'
);

transitionEnCours=true;

pageActuelle=nom;

document.querySelectorAll('.nav').forEach(b=>{
b.classList.remove('active');
});

let nav=document.getElementById('nav-'+nom);
if(nav)nav.classList.add('active');

let accueil=nom==='accueil';

document.getElementById('entete').style.display=
accueil?'block':'none';

if(nom==='panier')afficherPanier();

if(nom==='detail')majBouton();

setTimeout(()=>{

anciennePage.classList.remove(
'sort-droite',
'sort-gauche',
'active'
);

nouvellePage.classList.remove(
'entre-droite',
'entre-gauche'
);

nouvellePage.classList.add('active');

transitionEnCours=false;

},340);

}

function ouvrirProduit(){
afficherPage('detail');
}

function ajouter(){

if(panier.length===0){

panier.push({
nom:'Sac à franges',
prix:20,
image:'sac_franges.jpg'
});

}

majBouton();
afficherPage('panier');
afficherPanier();

}

function majBouton(){

let b=document.getElementById('ajout');

b.disabled=panier.length>=1;

b.textContent=panier.length>=1
?'Article déjà dans le panier'
:'Ajouter au panier';

}

function afficherPanier(){

let zone=document.getElementById('contenu-panier');

if(panier.length===0){

zone.innerHTML=
'<p class="vide">Ton panier est vide pour le moment.</p>';

return;

}

zone.innerHTML=`
<div class="bloc">
<div class="ligne">

<img class="image-panier"
src="sac_franges.jpg"
alt="Sac à franges">

<div class="info">
<strong>Sac à franges</strong>
<p>20 €</p>
<p>Quantité : 1</p>

<button class="supprimer"
onclick="supprimer()">Supprimer</button>
</div>

</div>
</div>

<div class="bloc">
<strong>Total : 20 €</strong>
</div>
`;

}

function supprimer(){

panier=[];
afficherPanier();
majBouton();

}

function filtrer(categorie,bouton){

document.querySelectorAll('.categorie').forEach(b=>{
b.classList.remove('active');
});

bouton.classList.add('active');

let nombre=0;

document.querySelectorAll('.produit').forEach(p=>{

let visible=categorie==='Tout'||
p.dataset.category.includes(categorie);

p.style.display=visible?'block':'none';

if(visible)nombre++;

});

document.getElementById('aucun').style.display=
nombre?'none':'block';

}

function rechercher(){

let mot=document.getElementById('recherche')
.value.toLowerCase();

let nombre=0;

document.querySelectorAll('.produit').forEach(p=>{

let visible=p.dataset.name.toLowerCase().includes(mot);

p.style.display=visible?'block':'none';

if(visible)nombre++;

});

document.getElementById('aucun').style.display=
nombre?'none':'block';

}

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js');
});

}

</script>

</body>
</html>
