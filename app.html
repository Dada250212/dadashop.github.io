<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dada Shop</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
background:#fff;
color:#000;
padding-bottom:75px;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:10;
background:#fff;
border-bottom:1px solid #ddd;
padding:16px;
}

.logo{
text-align:center;
font-size:25px;
font-weight:bold;
letter-spacing:2px;
margin-bottom:15px;
}

.recherche{
width:100%;
padding:12px 15px;
border:1px solid #ccc;
border-radius:3px;
font-size:15px;
outline:none;
}

/* CATEGORIES */
.categories{
display:flex;
gap:20px;
overflow-x:auto;
padding:15px 16px;
border-bottom:1px solid #eee;
white-space:nowrap;
}

.categories button{
background:none;
border:none;
font-size:14px;
cursor:pointer;
padding-bottom:5px;
}

.categories button.active{
font-weight:bold;
border-bottom:2px solid #000;
}

/* PRODUITS */
.grille{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:14px;
}

.produit{
border:none;
background:#fff;
text-align:left;
cursor:pointer;
color:#000;
}

.image-produit{
width:100%;
aspect-ratio:1 / 1.15;
background:#f5f5f5;
overflow:hidden;
}

.image-produit img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.infos{
padding:9px 2px 12px;
}

.infos h2{
font-size:15px;
font-weight:normal;
}

.prix{
margin-top:6px;
font-size:16px;
font-weight:bold;
}

/* PAGES */
.page{
display:none;
}

.page.active{
display:block;
}

/* FICHE PRODUIT */
.fiche{
padding:16px;
}

.retour{
border:none;
background:none;
font-size:16px;
cursor:pointer;
margin-bottom:15px;
}

.fiche-image{
width:100%;
background:#f5f5f5;
}

.fiche-image img{
width:100%;
display:block;
}

.fiche-nom{
font-size:22px;
margin-top:18px;
}

.fiche-prix{
font-size:18px;
font-weight:bold;
margin-top:8px;
}

.description-titre{
font-size:16px;
font-weight:bold;
margin-top:25px;
margin-bottom:8px;
}

.description{
font-size:15px;
line-height:1.5;
}

.ajouter{
width:100%;
background:#000;
color:#fff;
border:none;
padding:16px;
font-size:16px;
margin-top:25px;
cursor:pointer;
}

/* PANIER */
.panier-page{
padding:20px 16px;
}

.titre-page{
font-size:25px;
margin-bottom:20px;
}

.article-panier{
display:flex;
gap:12px;
border-bottom:1px solid #ddd;
padding-bottom:15px;
margin-bottom:15px;
}

.article-panier img{
width:90px;
height:100px;
object-fit:cover;
}

.article-info{
flex:1;
}

.article-info h3{
font-size:16px;
font-weight:normal;
margin-bottom:7px;
}

.article-info p{
font-weight:bold;
}

.quantite{
margin-top:10px;
}

.quantite button{
width:28px;
height:28px;
border:1px solid #ccc;
background:#fff;
cursor:pointer;
}

.total{
font-size:20px;
font-weight:bold;
margin-top:25px;
}

.panier-vide{
text-align:center;
margin-top:50px;
color:#666;
}

/* PROFIL */
.profil-page{
padding:20px 16px;
}

.profil-bloc{
border-bottom:1px solid #ddd;
padding:18px 0;
font-size:16px;
}

/* NAVIGATION */
.navigation{
position:fixed;
bottom:0;
left:0;
right:0;
height:68px;
background:#fff;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
z-index:20;
}

.navigation button{
border:none;
background:none;
color:#000;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
font-size:11px;
cursor:pointer;
}

.navigation svg{
width:24px;
height:24px;
fill:none;
stroke:#000;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

/* MESSAGE */
.message{
text-align:center;
padding:35px 15px;
color:#666;
}
</style>
</head>

<body>

<!-- PAGE ACCUEIL -->
<div id="accueil" class="page active">

<header>
<div class="logo">DADA SHOP</div>

<input
type="text"
class="recherche"
id="recherche"
placeholder="Rechercher un article..."
oninput="rechercher()"
>
</header>

<div class="categories">

<button class="active" onclick="filtrer('Tout', this)">
Tout
</button>

<button onclick="filtrer('Nouveautés', this)">
Nouveautés
</button>

<button onclick="filtrer('Sacs', this)">
Sacs
</button>

<button onclick="filtrer('Accessoires', this)">
Accessoires
</button>

<button onclick="filtrer('Vêtements', this)">
Vêtements
</button>

<button onclick="filtrer('Accessoires pour cheveux', this)">
Accessoires pour cheveux
</button>

</div>

<main class="grille" id="grille-produits">

<!-- SAC À FRANGES -->
<button
class="produit"
data-category="Sacs Nouveautés"
data-name="Sac à franges"
onclick="ouvrirProduit()"
>

<div class="image-produit">
<img
src="sac_franges.jpg"
alt="Sac à franges"
>
</div>

<div class="infos">

<h2>Sac à franges</h2>

<p class="prix">
20 €
</p>

</div>

</button>

</main>

</div>


<!-- PAGE PRODUIT -->
<div id="produit-page" class="page">

<div class="fiche">

<button class="retour" onclick="afficherPage('accueil')">
← Retour
</button>

<div class="fiche-image">

<img
src="sac_franges.jpg"
alt="Sac à franges"
>

</div>

<h1 class="fiche-nom">
Sac à franges
</h1>

<p class="fiche-prix">
20 €
</p>

<p class="description-titre">
Description
</p>

<p class="description">
Un sac à franges fait main, avec un style original
et facile à porter au quotidien.
</p>

<button
class="ajouter"
onclick="ajouterAuPanier()"
>
Ajouter au panier
</button>

</div>

</div>


<!-- PAGE PANIER -->
<div id="panier-page" class="page">

<div class="panier-page">

<h1 class="titre-page">
Panier
</h1>

<div id="contenu-panier"></div>

</div>

</div>


<!-- PAGE PROFIL -->
<div id="profil-page" class="page">

<div class="profil-page">

<h1 class="titre-page">
Profil
</h1>

<div class="profil-bloc">
Se connecter
</div>

<div class="profil-bloc">
Mes commandes
</div>

<div class="profil-bloc">
Informations personnelles
</div>

</div>

</div>


<!-- NAVIGATION -->
<nav class="navigation">

<button onclick="afficherPage('accueil')">

<svg viewBox="0 0 24 24">
<path d="M3 10.5L12 3l9 7.5"></path>
<path d="M5 9.5V21h14V9.5"></path>
</svg>

<span>Accueil</span>

</button>


<button onclick="afficherPage('panier-page')">

<svg viewBox="0 0 24 24">
<path d="M5 8h14l-1 12H6L5 8z"></path>
<path d="M9 8a3 3 0 0 1 6 0"></path>
</svg>

<span>Panier</span>

</button>


<button onclick="afficherPage('profil-page')">

<svg viewBox="0 0 24 24">
<circle cx="12" cy="8" r="3.5"></circle>
<path d="M5 21c.7-4 3-6 7-6s6.3 2 7 6"></path>
</svg>

<span>Profil</span>

</button>

</nav>


<script>

let panier = [];


/* AFFICHER UNE PAGE */
function afficherPage(page){

document.querySelectorAll('.page').forEach(function(p){
p.classList.remove('active');
});

document.getElementById(page).classList.add('active');

if(page === 'panier-page'){
afficherPanier();
}

window.scrollTo(0,0);
}


/* OUVRIR LE PRODUIT */
function ouvrirProduit(){

afficherPage('produit-page');

}


/* AJOUTER AU PANIER */
function ajouterAuPanier(){

const produit = panier.find(
item => item.nom === "Sac à franges"
);

if(produit){

produit.quantite++;

}else{

panier.push({
nom:"Sac à franges",
prix:20,
image:"sac_franges.jpg",
quantite:1
});

}

afficherPage('panier-page');

}


/* AFFICHER LE PANIER */
function afficherPanier(){

const contenu = document.getElementById("contenu-panier");

if(panier.length === 0){

contenu.innerHTML =
'<p class="panier-vide">Ton panier est vide.</p>';

return;

}

let total = 0;
let html = "";

panier.forEach(function(article, index){

total += article.prix * article.quantite;

html += `

<div class="article-panier">

<img
src="${article.image}"
alt="${article.nom}"
>

<div class="article-info">

<h3>${article.nom}</h3>

<p>${article.prix} €</p>

<div class="quantite">

<button onclick="modifierQuantite(${index}, -1)">
−
</button>

<span>
${article.quantite}
</span>

<button onclick="modifierQuantite(${index}, 1)">
+
</button>

</div>

</div>

</div>

`;

});

html += `
<div class="total">
Total : ${total} €
</div>
`;

contenu.innerHTML = html;

}


/* MODIFIER QUANTITÉ */
function modifierQuantite(index, changement){

panier[index].quantite += changement;

if(panier[index].quantite <= 0){

panier.splice(index,1);

}

afficherPanier();

}


/* FILTRER LES CATÉGORIES */
function filtrer(categorie, bouton){

document
.querySelectorAll('.categories button')
.forEach(function(btn){
btn.classList.remove('active');
});

bouton.classList.add('active');

const produits =
document.querySelectorAll('.produit');

produits.forEach(function(produit){

const categories =
produit.dataset.category;

if(
categorie === "Tout" ||
categories.includes(categorie)
){

produit.style.display = "";

}else{

produit.style.display = "none";

}

});

}


/* RECHERCHE */
function rechercher(){

const recherche =
document
.getElementById("recherche")
.value
.toLowerCase();

const produits =
document.querySelectorAll('.produit');

produits.forEach(function(produit){

const nom =
produit.dataset.name.toLowerCase();

if(nom.includes(recherche)){

produit.style.display = "";

}else{

produit.style.display = "none";

}

});

}

</script>

</body>
</html>
