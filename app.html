<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dada Shop</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, sans-serif;
background: #fff;
color: #000;
padding-bottom: 82px;
}

/* HAUT DE L'APPLICATION */
header {
background: #fff;
position: sticky;
top: 0;
z-index: 20;
border-bottom: 1px solid #ddd;
}

.top {
height: 68px;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 18px;
}

.nom {
font-size: 27px;
font-weight: 800;
letter-spacing: 4px;
}

.recherche {
padding: 0 15px 13px;
}

.recherche-box {
height: 46px;
border: 1px solid #000;
display: flex;
align-items: center;
background: #fff;
}

.recherche input {
flex: 1;
height: 100%;
border: none;
outline: none;
padding: 0 14px;
font-size: 15px;
}

.recherche button {
width: 48px;
height: 100%;
border: none;
background: #000;
color: #fff;
cursor: pointer;
}

/* CATEGORIES */
.categories {
display: flex;
overflow-x: auto;
gap: 25px;
padding: 0 15px 12px;
scrollbar-width: none;
}

.categories::-webkit-scrollbar {
display: none;
}

.categorie {
flex-shrink: 0;
background: none;
border: none;
font-size: 14px;
font-weight: 600;
color: #777;
padding-bottom: 7px;
cursor: pointer;
}

.categorie.active {
color: #000;
border-bottom: 2px solid #000;
}

/* TITRE */
.titre {
padding: 25px 15px 15px;
}

.titre h1 {
font-size: 28px;
font-weight: 700;
}

.titre p {
margin-top: 7px;
color: #666;
font-size: 14px;
}

/* PRODUITS */
.produits {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 1px;
background: #ddd;
}

.produit {
background: #fff;
cursor: pointer;
}

.image-produit {
width: 100%;
aspect-ratio: 1 / 1.15;
background: #f7f7f7;
overflow: hidden;
}

.image-produit img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

.sans-photo {
height: 100%;
display: flex;
align-items: center;
justify-content: center;
color: #777;
font-size: 13px;
}

.infos {
padding: 11px 10px 16px;
}

.infos h2 {
font-size: 15px;
margin-bottom: 7px;
}

.prix {
font-size: 16px;
font-weight: bold;
}

/* BARRE DU BAS */
.navigation {
position: fixed;
bottom: 0;
left: 0;
right: 0;
height: 78px;
background: #fff;
border-top: 1px solid #ddd;
display: flex;
justify-content: space-around;
align-items: center;
z-index: 50;
}

.nav-bouton {
background: none;
border: none;
color: #777;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 5px;
font-size: 12px;
cursor: pointer;
min-width: 80px;
}

.nav-bouton svg {
width: 25px;
height: 25px;
stroke: currentColor;
fill: none;
stroke-width: 1.7;
stroke-linecap: round;
stroke-linejoin: round;
}

.nav-bouton.active {
color: #000;
font-weight: bold;
}

/* PAGES PANIER / PROFIL */
.page {
display: none;
padding: 30px 20px;
}

.page.active {
display: block;
}

.page h1 {
font-size: 28px;
margin-bottom: 15px;
}

.vide {
text-align: center;
padding: 70px 20px;
color: #666;
}

.vide svg {
width: 55px;
height: 55px;
stroke: #000;
fill: none;
stroke-width: 1.5;
margin-bottom: 15px;
}

@media (min-width: 700px) {
.produits {
grid-template-columns: repeat(3, 1fr);
}

.titre,
.produits {
max-width: 1000px;
margin-left: auto;
margin-right: auto;
}
}
</style>
</head>

<body>

<!-- ACCUEIL -->
<main id="accueil" class="page active">

<header>
<div class="top">
<div class="nom">DADA SHOP</div>
</div>

<div class="recherche">
<div class="recherche-box">
<input
type="search"
id="recherche"
placeholder="Rechercher un produit..."
>

<button aria-label="Rechercher">
<svg width="20" height="20" viewBox="0 0 24 24"
fill="none" stroke="currentColor" stroke-width="2">
<circle cx="11" cy="11" r="7"></circle>
<line x1="16.5" y1="16.5" x2="22" y2="22"></line>
</svg>
</button>
</div>
</div>

<div class="categories">

<button class="categorie active" data-category="Tout">
Tout
</button>

<button class="categorie" data-category="Nouveautés">
Nouveautés
</button>

<button class="categorie" data-category="Sacs">
Sacs
</button>

<button class="categorie" data-category="Accessoires">
Accessoires
</button>

<button class="categorie" data-category="Vêtements">
Vêtements
</button>

<button class="categorie" data-category="Accessoires pour cheveux">
Accessoires pour cheveux
</button>

</div>
</header>


<div class="titre">
<h1>Découvre Dada Shop</h1>
<p>Nos créations faites avec soin.</p>
</div>


<section class="produits" id="listeProduits">

<!-- SAC À FRANGES -->
<article
class="produit"
data-category="Sacs Nouveautés"
data-name="Sac à franges"
>

<div class="image-produit">
<img
src="sac_franges.jpg"
alt="Sac à franges"
>
</div>

<div class="infos">
<h2>Sac à franges</h2>
<p class="prix">20 €</p>
</div>

</article>


<!-- PRODUIT À VENIR -->
<article
class="produit"
data-category="Nouveautés"
data-name="Produit"
>

<div class="image-produit">
<div class="sans-photo">
Bientôt disponible
</div>
</div>

<div class="infos">
<h2>Nouveau produit</h2>
<p class="prix">À venir</p>
</div>

</article>

</section>

</main>


<!-- PANIER -->
<main id="panier" class="page">

<h1>Panier</h1>

<div class="vide">

<svg viewBox="0 0 24 24">
<circle cx="9" cy="20" r="1"></circle>
<circle cx="18" cy="20" r="1"></circle>
<path d="M3 4h2l2.4 11.5a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 2-1.5L21 8H6"></path>
</svg>

<p>Ton panier est vide.</p>

</div>

</main>


<!-- PROFIL -->
<main id="profil" class="page">

<h1>Profil</h1>

<div class="vide">

<svg viewBox="0 0 24 24">
<circle cx="12" cy="8" r="4"></circle>
<path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
</svg>

<p>Ton espace personnel Dada Shop.</p>

</div>

</main>


<!-- NAVIGATION DU BAS -->
<nav class="navigation">

<button class="nav-bouton active" data-page="accueil">

<svg viewBox="0 0 24 24">
<path d="M3 10.5L12 3l9 7.5"></path>
<path d="M5 9.5V21h14V9.5"></path>
</svg>

<span>Accueil</span>

</button>


<button class="nav-bouton" data-page="panier">

<svg viewBox="0 0 24 24">
<circle cx="9" cy="20" r="1"></circle>
<circle cx="18" cy="20" r="1"></circle>
<path d="M3 4h2l2.4 11.5a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 2-1.5L21 8H6"></path>
</svg>

<span>Panier</span>

</button>


<button class="nav-bouton" data-page="profil">

<svg viewBox="0 0 24 24">
<circle cx="12" cy="8" r="4"></circle>
<path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
</svg>

<span>Profil</span>

</button>

</nav>


<script>

/* NAVIGATION */

const boutonsNavigation =
document.querySelectorAll(".nav-bouton");

const pages =
document.querySelectorAll(".page");

boutonsNavigation.forEach(function(bouton) {

bouton.addEventListener("click", function() {

const page = bouton.dataset.page;

pages.forEach(function(element) {
element.classList.remove("active");
});

document
.getElementById(page)
.classList.add("active");

boutonsNavigation.forEach(function(element) {
element.classList.remove("active");
});

bouton.classList.add("active");

window.scrollTo(0, 0);

});

});


/* CATÉGORIES */

const boutonsCategories =
document.querySelectorAll(".categorie");

const produits =
document.querySelectorAll(".produit");

boutonsCategories.forEach(function(bouton) {

bouton.addEventListener("click", function() {

const categorie =
bouton.dataset.category;

boutonsCategories.forEach(function(element) {
element.classList.remove("active");
});

bouton.classList.add("active");

produits.forEach(function(produit) {

if (categorie === "Tout") {

produit.style.display = "block";

} else {

const categoriesProduit =
produit.dataset.category;

if (
categoriesProduit.includes(categorie)
) {

produit.style.display = "block";

} else {

produit.style.display = "none";

}

}

});

});

});


/* RECHERCHE */

const recherche =
document.getElementById("recherche");

recherche.addEventListener("input", function() {

const texte =
recherche.value.toLowerCase();

produits.forEach(function(produit) {

const nom =
produit.dataset.name.toLowerCase();

if (nom.includes(texte)) {

produit.style.display = "block";

} else {

produit.style.display = "none";

}

});

});

</script>

</body>
</html>
