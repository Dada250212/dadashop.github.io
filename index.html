<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dada Shop</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #fff7fb;

      color: #333;

    }

    header {

      background: #f3c6d8;

      padding: 25px;

      text-align: center;

    }

    header h1 {

      margin: 0;

      font-size: 38px;

    }

    nav {

      margin-top: 15px;

    }

    nav a {

      margin: 0 10px;

      text-decoration: none;

      color: #333;

      font-weight: bold;

    }

    .accueil {

      text-align: center;

      padding: 80px 20px;

    }

    .accueil h2 {

      font-size: 36px;

      margin-bottom: 15px;

    }

    .accueil p {

      font-size: 18px;

    }

    .bouton {

      display: inline-block;

      margin-top: 25px;

      padding: 14px 28px;

      background: #333;

      color: white;

      text-decoration: none;

      border-radius: 25px;

    }

    footer {

      text-align: center;

      padding: 25px;

      background: #f3c6d8;

      margin-top: 80px;

    }

  </style>

</head>

<body>

  <header>

    <h1>Dada Shop</h1>

    <nav>

      <a href="#">Accueil</a>

      <a href="#">Boutique</a>

      <a href="#">À propos</a>

      <a href="#">Contact</a>

    </nav>

  </header>

  <section class="accueil">

    <h2>Bienvenue chez Dada Shop 🩷</h2>

    <p>

      Découvrez notre collection d'accessoires et de créations en crochet.

    </p>

    <a class="bouton" href="#">Découvrir la boutique</a>

  </section>

  <footer>

    © 2026 Dada Shop

  </footer>

</body>

</html>
